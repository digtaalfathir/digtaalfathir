name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # setiap hari 00:00 UTC
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=8&hide=jupyter%20notebook,python&size_weight=0.3&count_weight=1
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      # Committed as me (noreply email) so these count on the contribution graph.
      # Cards only commit when they changed; the heartbeat always commits → 1–2 per day.
      - name: Commit cards & heartbeat
        run: |
          git config user.name "Rifky Andigta AlFathir"
          git config user.email "152999006+digtaalfathir@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update readme cards" || true
          date -u +%FT%TZ > profile/.heartbeat
          git add profile/.heartbeat
          git commit -m "chore: heartbeat"
          git push
